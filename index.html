<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轻盈日记</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻盈日记">
<meta name="theme-color" content="#FAF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: one phone column; a tinted "督促" block leads, plain cards follow; tab bar pinned to the bottom. */
:root{
  --bg:#FAF6F7; --surface:#FFFFFF; --surface-2:#F4EDF0; --line:#E8DDE2;
  --fg:#2A2127; --muted:#7A6B74; --accent:#86385F; --accent-soft:#F3E4EC; --on-accent:#FFFFFF;
  --period:#CF4469; --period-soft:rgba(207,68,105,.13);
  --fertile:#6476BF; --fertile-soft:rgba(100,118,191,.13);
  --move:#3F8159; --move-soft:rgba(63,129,89,.13);
  --water:#3E8DB8; --warn:#A86B12; --alert:#B8392A;
  --f-display:"Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --f-body:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#161117; --surface:#201922; --surface-2:#2A212D; --line:#3A2F3E;
  --fg:#F2E8EE; --muted:#A8979F; --accent:#E092B8; --accent-soft:#36222F; --on-accent:#1B1219;
  --period:#F2708F; --period-soft:rgba(242,112,143,.17);
  --fertile:#9AA8EC; --fertile-soft:rgba(154,168,236,.16);
  --move:#7CC497; --move-soft:rgba(124,196,151,.15);
  --water:#72B8DE; --warn:#E3AA52; --alert:#F08470; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.app{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px;line-height:1.3}
h2{font-size:17px}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.streak{display:inline-flex;align-items:baseline;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.streak b{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.banner{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.view{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hero{background:var(--accent-soft);border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 120px;min-width:0}
.num{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.num small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);margin-left:3px}
.in,select.in,textarea.in{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
textarea.in{resize:vertical;min-height:64px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--alert);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.flow[aria-pressed="true"]{background:var(--period);border-color:var(--period)}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:block}
.sep{height:1px;background:var(--line);margin:14px 0}
.sup{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px}
.ring .bg{stroke:var(--line);fill:none}
.ring .fg{stroke:var(--accent);fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{fill:var(--fg);font-family:var(--f-display);font-weight:700}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px}
.check{display:flex;align-items:center;gap:6px}
.box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.check.ok .box{background:var(--move);border-color:var(--move)}
.check.ok .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.check.ok span{color:var(--muted);text-decoration:line-through}
.nudges{display:grid;gap:10px;margin-top:14px}
.nudge{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.nudge .d{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--muted)}
.nudge.alert .d{background:var(--alert)} .nudge.warn .d{background:var(--warn)}
.nudge.good .d{background:var(--move)} .nudge.cycle .d{background:var(--period)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.datebar .nav{background:none;border:0;width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--accent)}
.datebar .nav:disabled{color:var(--line);cursor:default}
.datebar .mid{text-align:center;font-weight:600}
.datebar .mid .muted{font-weight:400;font-size:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:12px;padding:0;text-decoration:underline}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.pill.period{background:var(--period-soft);color:var(--period)}
.pill.fertile{background:var(--fertile-soft);color:var(--fertile)}
.delta-down{color:var(--move)} .delta-up{color:var(--warn)}
.exlist{display:grid;gap:6px;margin-bottom:12px}
.exitem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px}
.exitem .t{flex:1;min-width:0}
.exitem button{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.exform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exform select{grid-column:1/-1}
@media (min-width:520px){ .exform{grid-template-columns:1.4fr 1fr 1fr auto} .exform select{grid-column:auto} }
.energy{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px}
.energy .k{font-size:12px;color:var(--muted)}
.energy .v{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:30px;height:38px;border:1.5px solid var(--water);border-radius:4px 4px 9px 9px;background:transparent;padding:0;position:relative;overflow:hidden}
.cup.on{background:var(--water)}
.cup.on::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:3px;border-radius:2px;background:var(--surface);opacity:.5}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.remrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.remrow:last-of-type{border-bottom:0}
.remrow .t{font-weight:600}
.remrow input[type=time]{width:auto}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats .k{font-size:12px;color:var(--muted)}
.stats .v{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.chart{width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lab{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-band{fill:var(--period-soft)}
.c-dot{fill:var(--muted);opacity:.55}
.c-avg{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent);opacity:.08}
.c-end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-endlab{fill:var(--accent);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-tgt{stroke:var(--move);stroke-width:1.5;stroke-dasharray:5 4}
.c-tgtlab{fill:var(--move);font-size:11px;font-family:var(--f-body)}
.c-bar{fill:var(--line)} .c-bar.ok{fill:var(--move)}
.c-pdot{fill:var(--period)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.cyc-big{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.2}
.cyc-big em{font-style:normal;color:var(--period)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-h button{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;color:var(--accent);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid transparent;background:none;display:grid;place-items:center;font-size:14px;position:relative;padding:0;font-variant-numeric:tabular-nums}
.cal .c.fertile{background:var(--fertile-soft);color:var(--fertile)}
.cal .c.pred{border:1.5px dashed var(--period);color:var(--period)}
.cal .c.period{background:var(--period);color:#fff}
.cal .c.today{box-shadow:0 0 0 2px var(--accent)}
.cal .c.future{opacity:.75;cursor:default}
.cal .c.ovu::after{content:"";position:absolute;bottom:12%;width:4px;height:4px;border-radius:50%;background:var(--fertile)}
.cal .c.out{visibility:hidden}
.hist .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .r:last-child{border-bottom:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in-w{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:12px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="hello">轻盈日记</h1>
      <div class="sub" id="subline">体重 · 运动 · 消耗 · 生理期</div>
    </div>
    <div class="streak" id="streak" hidden></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabbar" aria-label="页面">
  <div class="in-w">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>今天</button>
    <button type="button" data-tab="trend"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>趋势</button>
    <button type="button" data-tab="cycle"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>周期</button>
    <button type="button" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8"/></svg>我的</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const today = () => ds(new Date());
const WD = '日一二三四五六';
const md = s => { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日`; };
const mdShort = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const numOrNull = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const mondayOf = d => add(d, -((parse(d).getDay() + 6) % 7));
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const A = null; // iPhone version: everything stays in this phone's browser storage

const EX = [['快走', 4.3], ['跑步', 8], ['跳绳', 11], ['跳操/帕梅拉', 6.5], ['HIIT', 8], ['力量训练', 5], ['瑜伽', 2.5], ['普拉提', 3], ['游泳', 6], ['骑行', 6], ['爬楼梯', 8], ['跳舞', 5], ['羽毛球', 5.5], ['拉伸', 2.3], ['其他', 4]];
const FLOW = ['无', '少量', '中等', '较多'];
const SYM = ['痛经', '腰酸', '腹胀', '乳房胀痛', '头痛', '长痘', '嘴馋', '失眠', '疲惫'];
const MOOD = ['很好', '不错', '一般', '低落', '烦躁'];
const PHASE = { period: '经期', follicular: '卵泡期', fertile: '易孕期（估算）', luteal: '黄体期', pms: '经前期', late: '月经推迟' };
const DEF = { name: '', height: null, age: null, startWeight: null, targetWeight: null, targetDate: '', activity: 1.2, exDaysGoal: 4, exMinGoal: 30, waterGoal: 8, cycleLen: 28, periodLen: 5, lastPeriod: '', tone: 'gentle' };
const REM_DEF = { morningOn: true, morning: '07:30', eveningOn: true, evening: '21:00' };

/* ---------- storage (on this phone) ---------- */
const Store = {
  load() {
    try { const s = A ? A.load() : localStorage.getItem('qingying'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  save(obj) {
    const s = JSON.stringify(obj);
    try {
      if (A) { if (!A.save(s)) toast('保存失败，手机存储空间可能不够了'); }
      else localStorage.setItem('qingying', s);
    } catch (e) { toast('保存失败了'); }
  }
};
function loadReminders() {
  try { return { ...REM_DEF, ...(A ? JSON.parse(A.getReminders()) : JSON.parse(localStorage.getItem('qingying-rem') || '{}')) }; } catch (e) { return { ...REM_DEF }; }
}

/* ---------- state ---------- */
const saved = Store.load() || {};
const S = {
  view: 'today', date: today(), range: 30, cal: today().slice(0, 7),
  profile: saved.profile || null, days: saved.days || {},
  rem: loadReminders(), notifOk: true, pendingImport: null,
  hideInstall: (() => { try { return localStorage.getItem('qingying-hide-install') === '1'; } catch (e) { return false; } })()
};

const P = () => ({ ...DEF, ...(S.profile || {}) });
const day = d => S.days[d] || { date: d };
const exMinManual = t => (t.ex || []).reduce((a, e) => a + (+e.m || 0), 0);
// Watch exercise minutes already include workouts logged by hand, so take the larger of the two.
const exMin = t => Math.max(exMinManual(t), +(t.watch && t.watch.ex) || 0);
const exKcal = t => (t.ex || []).reduce((a, e) => a + (+e.k || 0), 0);
const logged = t => t.weight != null || exMin(t) > 0 || t.intake != null;
function latestWeight(upto) {
  for (let i = 0; i < 180; i++) { const w = S.days[add(upto, -i)]?.weight; if (w != null) return w; }
  return numOrNull(P().startWeight);
}
function avg7(d) {
  const ws = []; for (let i = 0; i < 7; i++) { const w = S.days[add(d, -i)]?.weight; if (w != null) ws.push(w); }
  return ws.length ? avg(ws) : null;
}
function energy(d) {
  const p = P(), t = day(d), w = latestWeight(d), h = numOrNull(p.height), a = numOrNull(p.age);
  const bmr = (w && h && a) ? 10 * w + 6.25 * h - 5 * a - 161 : null;
  const tdee = bmr ? bmr * (+p.activity || 1.2) : null;
  const wt = t.watch || {};
  if (wt.active != null) {
    const resting = wt.resting != null ? wt.resting : bmr;
    const total = resting != null ? resting + wt.active : null;
    return { measured: true, bmr, tdee, resting, active: wt.active, ex: wt.active, total, gap: (total != null && t.intake != null) ? total - t.intake : null, intake: t.intake };
  }
  const ex = exKcal(t);
  const total = tdee != null ? tdee + ex : null;
  const gap = (total != null && t.intake != null) ? total - t.intake : null;

/* ---------- cycle ---------- */
function cycleInfo() {
  const p = P();
  const flowDays = Object.keys(S.days).filter(k => (S.days[k].flow || 0) > 0).sort();
  const runs = [];
  for (const k of flowDays) {
    const r = runs[runs.length - 1];
    if (r && diff(k, r.end) <= 2) r.end = k; else runs.push({ start: k, end: k });
  }
  runs.forEach(r => r.len = diff(r.end, r.start) + 1);

  if (isDate(p.lastPeriod) && !runs.some(r => Math.abs(diff(r.start, p.lastPeriod)) < 10)) {
    runs.push({ start: p.lastPeriod, end: add(p.lastPeriod, PLdef - 1), len: PLdef, seed: true });
    runs.sort((a, b) => a.start < b.start ? -1 : 1);
  }

  const gaps = [];
  for (let i = 1; i < starts.length; i++) { const g = diff(starts[i], starts[i - 1]); if (g >= 20 && g <= 45) gaps.push(g); }
  const rg = gaps.slice(-6);
  const L = rg.length ? Math.round(avg(rg)) : (+p.cycleLen || 28);
  const lens = runs.filter(r => !r.seed).map(r => r.len).slice(-6);
  const PL = lens.length ? Math.round(avg(lens)) : PLdef;
  return { runs, starts, L, PL, gaps };
}
function phaseOn(d, ci) {

  const run = ci.runs.find(r => r.start === last);
  const n = diff(d, last) + 1;
  const next = add(last, ci.L);
  const ovu = add(next, -14);
  let phase;
  const flowing = (day(d).flow || 0) > 0;
  const ongoing = d === today() && n <= ci.PL && diff(d, run.end) === 1;
  if (flowing || n <= run.len || ongoing) phase = 'period';
  else if (d > next) phase = 'late';
  else if (diff(d, ovu) >= -5 && diff(d, ovu) <= 1) phase = 'fertile';
  else if (diff(next, d) <= 7) phase = 'pms';
  else if (d < ovu) phase = 'follicular';

  return { phase, n, next, ovu, last, late: Math.max(0, diff(d, next)), toNext: diff(next, d) };
}

  const m = {}; const put = (k, f) => { (m[k] = m[k] || {})[f] = true; };
  ci.runs.forEach(r => { for (let i = 0; i < r.len; i++) put(add(r.start, i), 'period'); });
  const last = ci.starts[ci.starts.length - 1];
  if (!last) return m;

    const ps = add(last, ci.L * k), ovu = add(ps, -14);
    for (let i = -5; i <= 1; i++) put(add(ovu, i), 'fertile');
    put(ovu, 'ovu');
    for (let i = 0; i < ci.PL; i++) { const kk = add(ps, i); if (!m[kk]?.period) put(kk, 'pred'); }
  }
  return m;
}

/* ---------- supervision ---------- */
const exGoalFor = ph => ph?.phase === 'period' ? Math.round((+P().exMinGoal || 30) / 2) : (+P().exMinGoal || 30);

}
function nudges(d, ci, ph) {

  if (gapW === null) out.push({ lv: 'warn', tx: '还没有体重记录。早上起床、上完厕所、空腹称一次最准。' });
  else if (gapW >= 2) out.push({ lv: gapW >= 4 ? 'alert' : 'warn', tx: strict ? `已经 ${gapW} 天没称体重了。不称就看不见变化，明早起床第一件事上秤。` : `有 ${gapW} 天没称体重啦，明早起床后称一下就好。` });

  } else if (mins >= exGoal && mins > 0) out.push({ lv: 'good', tx: `运动 ${mins} 分钟，消耗约 ${Math.round(exKcal(t))} kcal，目标完成。` });

  else if (goalDays - done > left) out.push({ lv: 'alert', tx: `本周运动 ${done} 天，目标 ${goalDays} 天，剩下的天数已经不够了。下周从周一开始补上。` });
  else if (dow >= 3) out.push({ lv: 'warn', tx: `本周运动 ${done}/${goalDays} 天，还剩 ${6 - dow} 天，要抓紧了。` });

  const en = energy(d);
  if (en.gap != null) {
    if (en.gap < 0) out.push({ lv: 'warn', tx: `摄入比消耗多 ${Math.round(-en.gap)} kcal。晚饭减掉主食的一半，或者再走 30 分钟。` });
    else if (en.gap > 1000) out.push({ lv: 'alert', tx: `热量缺口 ${Math.round(en.gap)} kcal，太大了。长期这样容易掉肌肉，也可能让月经推迟，适当多吃一点蛋白质。` });
    else if (en.gap >= 300) out.push({ lv: 'good', tx: `热量缺口约 ${Math.round(en.gap)} kcal，在 300–800 的健康区间附近。` });

    else if (ch < -0.1) out.push({ lv: 'good', tx: `7 日均值比上周低 ${f1(-ch)} kg，方向是对的。` });
    else if (ch > 0.3 && water) out.push({ lv: 'cycle', tx: `体重比上周高 ${f1(ch)} kg，现在是${PHASE[ph.phase]}，多半是水分，经期结束后一般会回落。` });
    else if (ch > 0.3) out.push({ lv: strict ? 'alert' : 'warn', tx: strict ? `7 日均值比上周涨了 ${f1(ch)} kg。看一下这周的饮食记录，找出多吃的那一顿。` : `7 日均值比上周高 ${f1(ch)} kg，这周留意一下晚饭和零食。` });
  }

  if (ph) {
    if (ph.phase === 'period') out.push({ lv: 'cycle', tx: `经期第 ${ph.n} 天。多喝温水，注意保暖，体重先别太在意。` });
    else if (ph.phase === 'pms') out.push({ lv: 'cycle', tx: `距离下次月经约 ${ph.toNext} 天。经前容易水肿、嘴馋，体重涨 0.5–2 kg 属正常，看 7 日均值就好。` });
    else if (ph.phase === 'follicular') out.push({ lv: 'cycle', tx: '卵泡期，体力和状态通常比较好，适合安排力量训练或提高强度。' });
    else if (ph.phase === 'late') out.push({ lv: ph.late >= 7 ? 'warn' : 'cycle', tx: ph.late >= 7 ? `月经已推迟 ${ph.late} 天。如果持续推迟或身体不舒服，建议去医院看看。` : `月经比预计晚了 ${ph.late} 天，偶尔推迟几天很常见。来了记得在下面记录。` });

function vTrend() {

  const sw = numOrNull(p.startWeight), tw = numOrNull(p.targetWeight), hgt = numOrNull(p.height);
  const ch = cur != null && sw != null ? cur - sw : null;

  let pace = '';
  if (rem != null && rem > 0 && isDate(p.targetDate)) { const wk = diff(p.targetDate, today()) / 7; if (wk > 0) pace = `每周需减 ${f1(rem / wk)} kg`; }

function weekTable() {
  const rows = []; let mon = mondayOf(today());
  for (let w = 0; w < 8; w++) {
    let ws = [], exd = 0, mins = 0, kc = 0;
    for (let i = 0; i < 7; i++) { const d = add(mon, i); if (d > today()) break; const t = day(d); if (t.weight != null) ws.push(t.weight); if (exMin(t) > 0) exd++; mins += exMin(t); kc += exKcal(t); }
    rows.push(`<tr><td>${mdShort(mon)} 起${w === 0 ? '（本周）' : ''}</td><td>${ws.length ? f1(avg(ws)) : '–'}</td><td>${exd}</td><td>${mins}</td><td>${Math.round(kc)}</td></tr>`);
    mon = add(mon, -7);
  }
  return `<table><thead><tr><th>周</th><th>平均体重</th><th>运动天数</th><th>分钟</th><th>运动消耗 kcal</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}
function drawWeight() {
  const box = $('#wchart'); if (!box) return;
  const range = S.range, W = Math.max(280, Math.round(box.clientWidth || 600)), H = W < 420 ? 200 : 240;
  const m = { l: 34, r: 46, t: 14, b: 24 };
  const end = today(), dates = Array.from({ length: range }, (_, i) => add(end, i - range + 1));
  const pts = dates.map((d, i) => ({ i, d, w: S.days[d]?.weight ?? null, a: avg7(d), f: (S.days[d]?.flow || 0) > 0 }));
  const ws = pts.filter(p => p.w != null);
  if (ws.length < 2) { box.innerHTML = `<div class="empty">记录 2 天以上的体重后，这里会画出你的体重曲线和 7 日均值。</div>`; return; }
  const tgt = numOrNull(P().targetWeight);
  let lo = Math.min(...ws.map(p => p.w)), hi = Math.max(...ws.map(p => p.w));
  const showT = tgt != null && tgt >= lo - 3 && tgt <= hi + 3;
  if (showT) { lo = Math.min(lo, tgt); hi = Math.max(hi, tgt); }
  const pv = Math.max(0.4, (hi - lo) * 0.12); lo -= pv; hi += pv;
  const step = [0.2, 0.5, 1, 2, 5, 10].find(s => (hi - lo) / s <= 5) || 10;
  const x = i => m.l + (W - m.l - m.r) * (i / (range - 1)), y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const bw = (W - m.l - m.r) / (range - 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${range} 天体重曲线">`;
  pts.filter(p => p.f).forEach(p => s += `<rect class="c-band" x="${Math.max(m.l, x(p.i) - bw / 2)}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}"/>`);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const yy = y(v); s += `<line class="c-grid" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/><text class="c-lab" x="${m.l - 6}" y="${yy + 4}" text-anchor="end">${step < 1 ? v.toFixed(1) : Math.round(v)}</text>`;
  }
  if (showT) { const yy = y(tgt); s += `<line class="c-tgt" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}"/><text class="c-tgtlab" x="${W - m.r + 4}" y="${yy + 4}">目标</text>`; }
  ws.forEach(p => s += `<circle class="c-dot" cx="${x(p.i)}" cy="${y(p.w)}" r="${range > 60 ? 2 : 3}"/>`);
  const ap = pts.filter(p => p.a != null);
  if (ap.length) {
    const line = ap.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.a).toFixed(1)}`).join('');
    s += `<path class="c-area" d="${line}L${x(ap[ap.length - 1].i)},${H - m.b}L${x(ap[0].i)},${H - m.b}Z"/><path class="c-avg" d="${line}"/>`;
    const e = ap[ap.length - 1];
    s += `<circle class="c-end" cx="${x(e.i)}" cy="${y(e.a)}" r="4.5"/><text class="c-endlab" x="${x(e.i) + 7}" y="${y(e.a) + (showT && Math.abs(y(e.a) - y(tgt)) < 14 ? -8 : 4)}">${f1(e.a)}</text>`;
  }
  [0, Math.floor((range - 1) / 2), range - 1].forEach((i, k) => s += `<text class="c-lab" x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${mdShort(dates[i])}</text>`);
  box.innerHTML = s + '</svg>';
}
function drawExercise() {
  const box = $('#xchart'); if (!box) return;
  const range = Math.min(S.range, 30), W = Math.max(280, Math.round(box.clientWidth || 600)), H = 150, m = { l: 34, r: 10, t: 10, b: 30 };
  const goal = +P().exMinGoal || 30;
  const dates = Array.from({ length: range }, (_, i) => add(today(), i - range + 1));
  const vals = dates.map(d => exMin(day(d)));
  if (!vals.some(v => v > 0)) { box.innerHTML = `<div class="empty">在「今天」里添加运动后，这里会显示每天的运动分钟。</div>`; return; }
  const max = Math.max(goal * 1.3, ...vals), cw = (W - m.l - m.r) / range, bw = Math.max(3, cw * 0.62);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${range} 天运动分钟">`;
  [0, goal].forEach(v => s += `<line class="${v ? 'c-tgt' : 'c-grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="c-lab" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`);
  vals.forEach((v, i) => {
    const xx = m.l + cw * i + (cw - bw) / 2;
    if (v > 0) s += `<rect class="c-bar ${v >= goal ? 'ok' : ''}" x="${xx}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="2"/>`;
    if ((day(dates[i]).flow || 0) > 0) s += `<circle class="c-pdot" cx="${xx + bw / 2}" cy="${H - m.b + 7}" r="2.5"/>`;
  });
  [0, range - 1].forEach((i, k) => s += `<text class="c-lab" x="${m.l + cw * i + cw / 2}" y="${H - 4}" text-anchor="${k ? 'end' : 'start'}">${mdShort(dates[i])}</text>`);
  box.innerHTML = s + '</svg>';
}

function vCycle() {
  const ci = cycleInfo(), ph = phaseOn(today(), ci), marks = calMarks(ci);
  let hero;
  if (!ph) hero = `<div class="cyc-big">还没有经期记录</div><p class="muted small" style="margin-top:6px">月经来的那天，在「今天」页把经量选成「少量 / 中等 / 较多」，或者点下面的按钮。也可以在「我的」里填上次开始日。</p>`;
  else {
    const big = ph.phase === 'period' ? `经期第 <em>${ph.n}</em> 天` : ph.phase === 'late' ? `已推迟 <em>${ph.late}</em> 天` : ph.toNext === 0 ? '预计<em>今天</em>来' : `距下次约 <em>${ph.toNext}</em> 天`;
    hero = `<div class="cyc-big">${big}</div><p class="muted small" style="margin-top:6px">当前：${PHASE[ph.phase]} · 预计下次 ${md(ph.next)} · 平均周期 ${ci.L} 天 · 经期约 ${ci.PL} 天</p>`;
  }
  const t = day(today());
  const btn = (t.flow || 0) > 0 ? `<button type="button" class="btn ghost" data-act="tab" data-tab="today">在「今天」修改经量和症状</button>` : `<button type="button" class="btn" data-act="periodStart">今天来月经了</button>`;

  const [cy, cm] = S.cal.split('-').map(Number);
  const first = new Date(cy, cm - 1, 1), lead = first.getDay(), dim = new Date(cy, cm, 0).getDate();
  let cells = WD.split('').map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += `<div class="c out"></div>`;
  for (let i = 1; i <= dim; i++) {
    const d = `${cy}-${pad(cm)}-${pad(i)}`, mk = marks[d] || {}, fut = d > today();
    const cls = ['c', mk.period ? 'period' : mk.pred ? 'pred' : mk.fertile ? 'fertile' : '', mk.ovu && !mk.period ? 'ovu' : '', d === today() ? 'today' : '', fut ? 'future' : ''].join(' ');
    cells += `<button type="button" class="${cls}" ${fut ? 'disabled' : `data-act="calDay" data-d="${d}"`} aria-label="${md(d)}${mk.period ? ' 经期' : mk.pred ? ' 预测经期' : mk.fertile ? ' 易孕期' : ''}">${i}</button>`;
  }
  const hist = [...ci.runs].reverse().slice(0, 8).map((r, k, arr) => {

    return `<div class="r"><span>${md(r.start)} 开始${r.seed ? ' <span class="pill">设置时填写</span>' : ''}</span><span class="muted tnum">经期 ${r.len} 天${cl ? ' · 周期 ' + cl + ' 天' : ''}</span></div>`;
  }).join('');
  return `<section class="card hero">${hero}<div class="row" style="margin-top:14px">${btn}</div></section>
    <section class="card"><div class="cal-h"><button type="button" data-act="calPrev" aria-label="上个月">‹</button><h2>${cy} 年 ${cm} 月</h2><button type="button" data-act="calNext" aria-label="下个月">›</button></div>

      <div><label class="label" for="gAct">日常活动量</label><select class="in" id="gAct">${[[1.2, '久坐（上班族）'], [1.375, '轻度（每天走动较多）'], [1.55, '中度（体力工作）']].map(([v, l]) => `<option value="${v}" ${+p.activity === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div></section>
    <section class="card"><div class="card-h"><h2>减重目标</h2></div><div class="form">
      ${f('gSW', '起始体重（kg）', p.startWeight, 'type="number" inputmode="decimal" step="0.1"')}
      ${f('gTW', '目标体重（kg）', p.targetWeight, 'type="number" inputmode="decimal" step="0.1"')}
      ${f('gTD', '目标日期', p.targetDate, `type="date" min="${today()}"`)}
      ${f('gED', '每周运动天数', p.exDaysGoal, 'type="number" inputmode="numeric" min="1" max="7"')}
      ${f('gEM', '每天运动分钟', p.exMinGoal, 'type="number" inputmode="numeric" min="5" max="300"')}
      ${f('gWG', '每天喝水（杯）', p.waterGoal, 'type="number" inputmode="numeric" min="1" max="20"')}
    </div></section>
    <section class="card"><div class="card-h"><h2>生理期</h2><span class="muted small">记录两次后会自动按真实周期计算</span></div><div class="form">
      ${f('gLP', '上次月经开始日', p.lastPeriod, `type="date" max="${today()}"`)}
      ${f('gCL', '平均周期（天）', p.cycleLen, 'type="number" inputmode="numeric" min="20" max="45"')}
      ${f('gPL', '经期天数', p.periodLen, 'type="number" inputmode="numeric" min="2" max="10"')}
    </div></section>
    <section class="card"><div class="card-h"><h2>监督风格</h2></div>
      <div class="chips" role="group" aria-label="监督风格">
        <button type="button" class="chip" data-act="tone" data-v="gentle" aria-pressed="${p.tone !== 'strict'}">温柔鼓励</button>
        <button type="button" class="chip" data-act="tone" data-v="strict" aria-pressed="${p.tone === 'strict'}">严格督促</button>
      </div>
      <p class="small muted" style="margin-top:8px">严格模式下，没完成的事会说得更直接，晚上没运动也会催你。</p></section>
    <div class="row"><button type="button" class="btn" data-act="saveGoals">保存资料和目标</button></div>
    <section class="card"><div class="card-h"><h2>备份与恢复</h2></div>
      <p class="small muted">记录只存在这台手机的这个 App 里。换手机、删掉桌面图标或清除 Safari 数据前，先导出一份备份，存到「文件」或发给自己。安卓版轻盈日记导出的备份也能在这里导入。</p>
      ${imp ? `<div class="banner" style="margin-top:12px;margin-bottom:0"><span>备份里有 ${imp.count} 天的记录。导入会覆盖手机上现在的全部记录。</span><span class="row"><button type="button" class="btn small danger" data-act="importYes">覆盖导入</button><button type="button" class="btn small ghost" data-act="importNo">取消</button></span></div>` : ''}
      <div class="row" style="margin-top:12px"><button type="button" class="btn ghost" data-act="export">导出备份</button><button type="button" class="btn ghost" data-act="import">导入备份</button><input type="file" id="impFile" accept=".json,application/json,text/plain" hidden></div></section>`;
}

/* ---------- events ---------- */
function updateEst() {
  const tSel = $('#exT'), mIn = $('#exM'), kIn = $('#exK'); if (!tSel) return null;
  const met = (EX.find(e => e[0] === tSel.value) || EX[EX.length - 1])[1];
  const w = latestWeight(S.date) || 55, mins = numOrNull(mIn.value);
  const est = mins ? Math.round(met * w * mins / 60) : null;
  kIn.placeholder = est ? `约 ${est}` : 'kcal';
  $('#exEst').textContent = est ? `按 ${tSel.value} ${mins} 分钟、体重 ${f1(w)} kg 估算，约消耗 ${est} kcal。可以填手环上的数字覆盖。` : '消耗留空会按运动强度和你的体重自动估算。';
  return est;
}
document.addEventListener('input', e => { if (e.target.id === 'exM' || e.target.id === 'exT') updateEst(); });
document.addEventListener('change', e => {
  if (e.target.id === 'impFile') {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { toast('文件太大，不像是备份文件'); return; }
    const rd = new FileReader();
    rd.onload = () => window.onImport(String(rd.result));
    rd.onerror = () => toast('读取文件失败了');
    rd.readAsText(f);
    return;
  }
  if (e.target.id === 'exT') updateEst();
  if (e.target.id === 'noteIn') { const v = e.target.value.slice(0, 2000); if (v !== (day(S.date).note || '')) { S.days = { ...S.days, [S.date]: { ...day(S.date), note: v, date: S.date } }; persist(); } }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wIn') act('saveW'); else if (e.target.id === 'inIn') act('saveIn'); else if (e.target.id === 'exM' || e.target.id === 'exK') act('addEx');
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-tab]'); if (!b || b.disabled) return;
  if (b.dataset.tab && !b.dataset.act) { go(b.dataset.tab); return; }
  act(b.dataset.act, b);
});
function go(view) { S.view = view; S.pendingImport = null; render(); window.scrollTo(0, 0); }
function act(a, b) {
  const d = S.date, t = day(d);
  switch (a) {
    case 'tab': go(b.dataset.tab); break;
    case 'prev': S.date = add(d, -1); render(); break;
    case 'next': if (d < today()) { S.date = add(d, 1); render(); } break;
    case 'gotoday': S.date = today(); render(); break;
    case 'saveW': {
      const v = numOrNull($('#wIn').value);
      if (v == null || v < 25 || v > 250) { toast('请输入 25–250 之间的体重（kg）'); return; }
      S.days = { ...S.days, [d]: { ...t, weight: Math.round(v * 10) / 10, date: d } };
      if (!P().startWeight) S.profile = { ...P(), startWeight: Math.round(v * 10) / 10 };
      persist(); render(); toast('体重已记录'); break;
    }
    case 'addEx': {
      const m = numOrNull($('#exM').value); if (!m || m <= 0) { toast('先填运动了多少分钟'); return; }
      const est = updateEst(); const k = numOrNull($('#exK').value) ?? est ?? 0;
      saveDay(d, { ex: [...(t.ex || []), { t: $('#exT').value, m: Math.round(m), k: Math.round(k) }] });
      toast(`已添加，消耗约 ${Math.round(k)} kcal`); break;
    }
    case 'delEx': { const ex = [...(t.ex || [])]; ex.splice(+b.dataset.i, 1); saveDay(d, { ex }); break; }
    case 'saveIn': {
      const raw = $('#inIn').value.trim(); const v = raw === '' ? null : numOrNull(raw);
      if (raw !== '' && (v == null || v < 0 || v > 8000)) { toast('请输入 0–8000 之间的热量'); return; }
      saveDay(d, { intake: v == null ? null : Math.round(v) }); toast(v == null ? '已清除摄入' : '摄入已保存'); break;
    }
    case 'water': { const n = +b.dataset.n; saveDay(d, { water: (t.water || 0) === n ? n - 1 : n }); break; }
    case 'flow': saveDay(d, { flow: +b.dataset.v }); break;
    case 'sym': { const s = new Set(t.sym || []); s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); saveDay(d, { sym: [...s] }); break; }
    case 'mood': saveDay(d, { mood: t.mood === b.dataset.v ? null : b.dataset.v }); break;
    case 'range': S.range = +b.dataset.v; render(); break;
    case 'calPrev': case 'calNext': { const [y, m] = S.cal.split('-').map(Number); const nd = new Date(y, m - 1 + (a === 'calNext' ? 1 : -1), 1); S.cal = `${nd.getFullYear()}-${pad(nd.getMonth() + 1)}`; render(); break; }
    case 'calDay': S.date = b.dataset.d; go('today'); break;
    case 'periodStart': S.date = today(); saveDay(today(), { flow: 2 }); toast('已记录：今天是经期第 1 天'); break;
    case 'tone': document.querySelectorAll('[data-act="tone"]').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'saveGoals': {
      const g = id => $('#' + id).value.trim();
      const tone = document.querySelector('[data-act="tone"][aria-pressed="true"]')?.dataset.v || 'gentle';
      saveProfile({
        name: g('gName').slice(0, 20), height: numOrNull(g('gH')), age: numOrNull(g('gA')), activity: +g('gAct') || 1.2,
        startWeight: numOrNull(g('gSW')), targetWeight: numOrNull(g('gTW')), targetDate: g('gTD'),
        exDaysGoal: numOrNull(g('gED')) || 4, exMinGoal: numOrNull(g('gEM')) || 30, waterGoal: numOrNull(g('gWG')) || 8,
        lastPeriod: g('gLP'), cycleLen: numOrNull(g('gCL')) || 28, periodLen: numOrNull(g('gPL')) || 5, tone
      });
      toast('资料和目标已保存'); break;
    }
    case 'saveRem': {
      S.rem = { morningOn: $('#rMo').checked, morning: $('#rMt').value || '07:30', eveningOn: $('#rEo').checked, evening: $('#rEt').value || '21:00' };
      try { if (A) A.setReminders(JSON.stringify(S.rem)); else localStorage.setItem('qingying-rem', JSON.stringify(S.rem)); } catch (e) {}
      const on = [S.rem.morningOn && '早上 ' + S.rem.morning, S.rem.eveningOn && '晚上 ' + S.rem.evening].filter(Boolean);
      checkNotif(); render(); toast(on.length ? '已设置：' + on.join('、') : '提醒已全部关闭'); break;
    }
    case 'testRem': pushStatus(); A?.testReminder(); toast(S.notifOk ? '已发送，看一下通知栏' : '通知被关掉了，先去设置里打开'); break;
    case 'appSettings': A?.openAppSettings(); break;
    case 'onboard': {
      const g = id => $('#' + id).value.trim();
      const w = numOrNull(g('obW'));
      if (!numOrNull(g('obH')) || !w) { toast('至少填一下身高和现在的体重'); return; }
      S.profile = { ...P(), name: g('obName').slice(0, 20), height: numOrNull(g('obH')), age: numOrNull(g('obA')), startWeight: w, targetWeight: numOrNull(g('obT')), lastPeriod: g('obP') };
      S.days = { ...S.days, [today()]: { ...day(today()), weight: Math.round(w * 10) / 10, date: today() } };
      persist(); render(); toast('好啦，从今天开始'); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify({ app: 'qingying', v: 1, exported: new Date().toISOString(), profile: S.profile, days: S.days })], { type: 'application/json' });
      const a2 = document.createElement('a');
      a2.href = URL.createObjectURL(blob); a2.download = `轻盈日记备份-${today()}.json`;
      document.body.appendChild(a2); a2.click();
      setTimeout(() => { URL.revokeObjectURL(a2.href); a2.remove(); }, 5000);
      toast('选「存储到文件」或发给自己保存'); break;
    }
    case 'import': $('#impFile').click(); break;
    case 'watchPaste': importWatchFromClipboard(); break;
    case 'watchParse': { const r = parseWatch($('#watchText').value); if (r) applyWatch(r); else toast('没找到手表数据，检查一下粘贴的内容'); break; }
    case 'watchClear': saveDay(d, { watch: null }); toast('已清除这天的手表数据'); break;
    case 'watchHelp': go('goals'); setTimeout(() => $('#watchGuide')?.scrollIntoView({ block: 'start' }), 50); break;
    case 'copyTpl': {
      const tpl = WATCH_TPL;
      const done = () => toast('模板已复制');
      try { navigator.clipboard.writeText(tpl).then(done, () => toast('复制失败，请手动输入模板')); } catch (e) { toast('复制失败，请手动输入模板'); }
      break;
    }
    case 'hideInstall': S.hideInstall = true; try { localStorage.setItem('qingying-hide-install', '1'); } catch (e) {} render(); break;
    case 'addCal': {
      S.rem = { morningOn: $('#rMo').checked, morning: $('#rMt').value || '07:30', eveningOn: $('#rEo').checked, evening: $('#rEt').value || '21:00' };
      try { localStorage.setItem('qingying-rem', JSON.stringify(S.rem)); } catch (e) {}
      if (!S.rem.morningOn && !S.rem.eveningOn) { toast('先打开至少一个提醒'); return; }
      const blob = new Blob([buildIcs(S.rem)], { type: 'text/calendar;charset=utf-8' });
      const a3 = document.createElement('a');
      a3.href = URL.createObjectURL(blob); a3.download = '轻盈日记提醒.ics';
      document.body.appendChild(a3); a3.click();
      setTimeout(() => { URL.revokeObjectURL(a3.href); a3.remove(); }, 5000);
      break;
    }
    case 'importYes': {
      const imp = S.pendingImport; if (!imp) return;
      S.profile = imp.profile; S.days = imp.days; S.pendingImport = null;
      persist(); render(); toast('已导入备份'); break;
    }
    case 'importNo': S.pendingImport = null; render(); break;
  }
}

/* ---------- phone hooks ---------- */
window.onExported = ok => { if (ok === true) toast('备份已保存'); else if (ok === false) toast('备份没有保存成功，换个位置再试'); };
window.onImport = text => {
  if (text == null) return;
  try {
    const o = JSON.parse(text);
    if (!o || o.app !== 'qingying' || typeof o.days !== 'object') throw 0;
    const days = {};
    for (const [k, v] of Object.entries(o.days)) if (isDate(k) && v && typeof v === 'object') days[k] = { ...v, date: k };
    S.pendingImport = { profile: o.profile && typeof o.profile === 'object' ? o.profile : null, days, count: Object.keys(days).length };
    S.view = 'goals'; render();
  } catch (e) { toast('这不是轻盈日记的备份文件'); }
};
window.onAndroidBack = () => {
  if (S.pendingImport) { S.pendingImport = null; render(); return true; }
  if (S.view !== 'today') { go('today'); return true; }
  if (S.date !== today()) { S.date = today(); render(); return true; }
  return false;
};
function checkNotif() { try { S.notifOk = A ? !!A.notifAllowed() : true; } catch (e) { S.notifOk = true; } }
let lastDay = today();
window.onAndroidResume = () => {
  checkNotif();
  const n = today();
  if (n !== lastDay) { if (S.date === lastDay) S.date = n; lastDay = n; }
  pushStatus();
  const ae = document.activeElement;
  if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
};
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'trend') { drawWeight(); drawExercise(); } }, 150); });

const WATCH_TPL = '轻盈日记手表数据\n日期:＿\n活动:＿\n静息:＿\n锻炼:＿\n步数:＿\n站立:＿\n经期:＿\n体重:＿';
// Reads the text the Shortcut copied: lines like "活动:568.3 kcal". Missing or odd values are skipped.
function parseWatch(text) {
  const s = String(text || '').replace(/：/g, ':');
  if (!/活动|静息|锻炼|步数|站立|体重/.test(s)) return null;
  const num = (label, lo, hi) => {
    const m = s.match(new RegExp(label + '[^\\d\\n]*([\\d][\\d,]*(?:\\.\\d+)?)'));
    if (!m) return null;
    const v = parseFloat(m[1].replace(/,/g, ''));
    return isFinite(v) && v >= lo && v <= hi ? v : null;
  };
  const r = { active: num('活动', 0, 8000), resting: num('静息', 0, 5000), ex: num('锻炼', 0, 1440), steps: num('步数', 0, 200000), stand: num('站立', 0, 24), weight: num('体重', 25, 250), date: null, flow: null };
  const dm = s.match(/日期[^\d\n]*(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if (dm) { const d = `${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}`; if (isDate(d) && d <= today()) r.date = d; }
  const fm = s.match(/经期:([^\n]*)/);
  if (fm) {
    const v = fm[1].trim();
    // Health writes words like 少量/中等/大量/未指定; anything recorded but unspecified counts as medium.
    if (/多|大|重|heavy/i.test(v)) r.flow = 3;
    else if (/中|medium/i.test(v)) r.flow = 2;
    else if (/少|轻|小|light/i.test(v)) r.flow = 1;
    else if (v && !/无|没有|none|＿/i.test(v)) r.flow = 2;
  }
  return ['active', 'resting', 'ex', 'steps', 'stand', 'weight', 'flow'].some(k => r[k] != null) ? r : null;
}
function applyWatch(r) {
  const d = r.date || S.date, t = day(d), now = new Date();
  const watch = { ...(t.watch || {}), at: `${pad(now.getHours())}:${pad(now.getMinutes())}` };
  ['active', 'resting', 'ex', 'steps', 'stand'].forEach(k => { if (r[k] != null) watch[k] = Math.round(r[k]); });
  const patch = { watch };
  if (r.weight != null && t.weight == null) patch.weight = Math.round(r.weight * 10) / 10;
  if (r.flow && !(t.flow > 0)) patch.flow = r.flow;
  S.watchManual = false;
  S.date = d;
  saveDay(d, patch);
  const parts = [r.active != null && `活动 ${Math.round(r.active)} 千卡`, r.ex != null && `锻炼 ${Math.round(r.ex)} 分钟`, r.steps != null && `${Math.round(r.steps)} 步`, patch.flow && '经期', patch.weight != null && `体重 ${f1(patch.weight)} kg`].filter(Boolean);
  toast('已导入' + (d === today() ? '' : '到 ' + md(d)) + '：' + (parts.join('、') || '静息消耗'));
}
async function importWatchFromClipboard() {
  try {
    const r = parseWatch(await navigator.clipboard.readText());
    if (r) { applyWatch(r); return; }
    toast('剪贴板里没有手表数据，先运行快捷指令');
  } catch (e) { toast('没读到剪贴板，可以手动粘贴'); }
  S.watchManual = true; render();
}
function watchEnergy(en) {
  return `<div class="energy">
      <div><div class="k">静息消耗</div><div class="v">${en.resting != null ? Math.round(en.resting) : '--'}</div></div>
      <div><div class="k">活动消耗</div><div class="v">${Math.round(en.active)}</div></div>
      <div><div class="k">总消耗</div><div class="v" style="color:var(--accent)">${en.total != null ? Math.round(en.total) : '--'}</div></div>
    </div><p class="small muted" style="margin-top:8px">来自 Apple Watch 实测${en.resting != null && (day(S.date).watch || {}).resting == null ? '（静息消耗按身高体重估算）' : ''}，手动加的运动不会重复计算。</p>`;
}

// Daily repeating calendar events with an alarm, in the phone's local time.
function buildIcs(rem) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const ymd = today().replace(/-/g, '');
  const ev = (key, hm, title, body) => [
    'BEGIN:VEVENT', `UID:qingying-${key}-${stamp}@qingying.local`, `DTSTAMP:${stamp}`,
    `DTSTART:${ymd}T${hm.replace(':', '')}00`, 'DURATION:PT5M', 'RRULE:FREQ=DAILY',
    `SUMMARY:${title}`, `DESCRIPTION:${body}`, 'TRANSP:TRANSPARENT',
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT'
  ];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Qingying Diary//CN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  if (rem.morningOn) lines.push(...ev('morning', rem.morning, '轻盈日记：空腹称体重', '起床上完厕所、空腹称一次，记到轻盈日记里。'));
  if (rem.eveningOn) lines.push(...ev('evening', rem.evening, '轻盈日记：睡前打卡', '记一下今天的运动、饮食、喝水和经期。'));
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') window.onAndroidResume(); });
render();
</script>
</body>
